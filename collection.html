<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Collection | HumanityCards</title>
  <meta name="description" content="See the HumanityCards your wallet holds, plus every figure you have pulled from packs.">
  <meta name="theme-color" content="#0c0d0f">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/hc.css?v=2">
</head>
<body>
  <header data-hc-nav></header>
  <main class="hc-main">
    <div class="hc-page-head">
      <div class="eyebrow">Collect</div>
      <h1>My Collection</h1>
      <p>The cards your connected wallet holds feed straight into the games. Below that, every figure you have pulled in practice packs.</p>
    </div>

    <section class="panel">
      <div class="row" style="justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
        <h2 class="mono" style="font-size:17px;margin:0">On-chain holdings <span class="mute" id="owned-count" style="font-size:13px"></span></h2>
        <div id="owned-status" class="mono mute" style="font-size:12px"></div>
      </div>
      <div class="mini-grid" id="owned-grid" style="margin-top:14px"></div>
      <div id="owned-empty"></div>
    </section>

    <section class="panel" style="margin-top:18px">
      <div class="row" style="justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
        <h2 class="mono" style="font-size:17px;margin:0">Practice pulls <span class="mute" id="pull-count" style="font-size:13px"></span></h2>
        <a class="btn btn-ghost" href="packs.html" style="font-size:13px;padding:8px 16px">Open more packs</a>
      </div>
      <div class="mini-grid" id="pull-grid" style="margin-top:14px"></div>
      <div id="pull-empty"></div>
    </section>
  </main>

  <footer class="hc-footer">HumanityCards · Collection</footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js" crossorigin="anonymous"></script>
  <script src="assets/js/config.js?v=2"></script>
  <script src="assets/js/roster.js?v=2"></script>
  <script src="assets/js/hc.js?v=2"></script>
  <script src="assets/js/card.js?v=2"></script>
  <script src="assets/js/relationships.js?v=2"></script>
  <script src="assets/js/wallet.js?v=2"></script>
  <script src="assets/js/page-collection.js?v=2"></script>
</body>
</html>

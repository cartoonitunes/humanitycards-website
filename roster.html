<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roster | HumanityCards</title>
  <meta name="description" content="Browse all 239 HumanityCards figures by rarity, era, and supply.">
  <meta name="theme-color" content="#0c0d0f">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/hc.css?v=2">
</head>
<body>
  <header data-hc-nav></header>
  <main class="hc-main">
    <div class="hc-page-head">
      <div class="eyebrow">Collect</div>
      <h1>The Roster</h1>
      <p>All 239 historical figures in the deck. Filter by rarity or search a name. Tap any card for the full on-chain styled view.</p>
    </div>

    <div class="filter-bar">
      <input type="search" id="search" placeholder="Search a figure (e.g. Tesla, Cleopatra)…" autocomplete="off">
      <div class="row gap-8" id="tier-chips"></div>
    </div>
    <div class="row" style="justify-content:space-between;align-items:center;margin-bottom:12px">
      <div class="mono mute" id="result-count" style="font-size:12px"></div>
      <div class="row gap-8" id="sort-chips"></div>
    </div>

    <div class="mini-grid" id="roster-grid"></div>
    <div class="empty" id="no-results" style="display:none">No figures match that filter.</div>
  </main>

  <footer class="hc-footer">HumanityCards · Roster</footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js" crossorigin="anonymous"></script>
  <script src="assets/js/config.js?v=2"></script>
  <script src="assets/js/roster.js?v=2"></script>
  <script src="assets/js/hc.js?v=2"></script>
  <script src="assets/js/card.js?v=2"></script>
  <script src="assets/js/relationships.js?v=2"></script>
  <script src="assets/js/wallet.js?v=2"></script>
  <script src="assets/js/page-roster.js?v=2"></script>
</body>
</html>
